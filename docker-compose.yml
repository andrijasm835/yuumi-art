services:
  app:
    build:
      context: .
      target: development
    container_name: yummi-art
    init: true
    restart: unless-stopped
    ports:
      - "${YUMMI_PORT:-3001}:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: "http://localhost:${YUMMI_PORT:-3001}"
      WATCHPACK_POLLING: "true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
